name: Build KDU

on:
  push:
    branches: [ "embedded" ]
  pull_request:
    branches: [ "embedded" ]
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release
  PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Taigei x64
        working-directory: ./Source/Taigei
        run: msbuild Taigei.vcxproj /m /p:Platform=${{ env.PLATFORM }} /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:PlatformToolset=v145 /p:SolutionDir=..\

      - name: Build Tanikaze
        working-directory: ./Source/Tanikaze
        run: msbuild Tanikaze.vcxproj /m /p:Platform=${{ env.PLATFORM }} /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:PlatformToolset=v145 /p:SolutionDir=..\

      - name: Build Hamakaze
        working-directory: ./Source/Hamakaze
        run: msbuild KDU.vcxproj /m /p:Platform=${{ env.PLATFORM }} /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:PlatformToolset=v145 /p:SolutionDir=..\

      - name: Collect static libraries and headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin\lib | Out-Null
          New-Item -ItemType Directory -Force -Path bin\include | Out-Null

          $tanikazeOut = "Source\Tanikaze\output\${{ env.PLATFORM }}\${{ env.BUILD_CONFIGURATION }}"
          $hamakazeOut = "Source\Hamakaze\output\${{ env.PLATFORM }}\${{ env.BUILD_CONFIGURATION }}"
          $taigeiOut    = "Source\Taigei\output\${{ env.PLATFORM }}\${{ env.BUILD_CONFIGURATION }}"

          if (!(Test-Path "$hamakazeOut\Hamakaze.lib")) { throw "Hamakaze.lib not found in $hamakazeOut" }
          if (!(Test-Path "$tanikazeOut\Tanikaze.lib")) { throw "Tanikaze.lib not found in $tanikazeOut" }
          if (!(Test-Path "$taigeiOut\Taigei.lib"))     { throw "Taigei.lib not found in $taigeiOut" }

          Copy-Item "$hamakazeOut\Hamakaze.lib" "bin\lib\Hamakaze.lib" -Force
          Copy-Item "$tanikazeOut\Tanikaze.lib" "bin\lib\Tanikaze.lib" -Force
          Copy-Item "$taigeiOut\Taigei.lib"     "bin\lib\Taigei.lib"   -Force

          Copy-Item "Source\Hamakaze\hamakaze.h" "bin\include\hamakaze.h" -Force
          Copy-Item "Source\Taigei\taigei.h"     "bin\include\taigei.h"   -Force
          Copy-Item "Source\Tanikaze\tanikaze.h" "bin\include\tanikaze.h" -Force
          Copy-Item "Source\Shared\kdulog.h"     "bin\include\kdulog.h"   -Force
          Copy-Item "Source\Shared\kdubase.h"    "bin\include\kdubase.h"  -Force

      - name: Upload KDU static libraries artifact
        uses: actions/upload-artifact@v6
        with:
          name: kdu_static_libraries
          path: bin\*
